<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bound Values</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      bound-values {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      bound-values > button {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 6px 10px;
      }
      bound-values > button:hover,
      bound-values > button:active {
        cursor: pointer;
        background-color: #e6e6e6;
      }
      bound-values > input {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 6px 10px;
        width: 60%;
      }
      bound-values > p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <bound-values>
      <button @click="increment">
        Clicked <x-signal id="count">0</x-signal> times
      </button>
      <button @click="increment">
        Clicked <x-signal bind="#count">0</x-signal> times
      </button>
      <x-signal bind:value="#count">
        <input type="number" value="0" />
      </x-signal>
      <p>Bound to count state: <x-signal bind="#count">0</x-signal></p>
    </bound-values>
    <script type="module">
      import { component, signal } from "../../src/index.ts";
      const count = signal("bound-values #count");
      function increment() {
        count.state = count.state + 1;
      }
      component("bound-values", [increment]);
    </script>
  </body>
</html>
