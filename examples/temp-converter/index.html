<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      temp-converter input {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <!-- https://eugenkiss.github.io/7guis/tasks/#temp -->
    <temp-converter>
      <x-signal id="c" track="value">
        <input @input="setFromC" type="number" value="0" />
      </x-signal>
      °C =
      <x-signal id="f" track="value">
        <input @input="setFromF" type="number" value="32" />
      </x-signal>
      °F
    </temp-converter>
    <script type="module">
      import { component, signal, effect } from "../../src/index.ts";

      const c = signal("temp-converter #c");
      const f = signal("temp-converter #f");

      function setFromC(event) {
        const value = event.target.value;
        c.state = +value;
        f.state = +(32 + (9 / 5) * c.state).toFixed(1);
      }

      function setFromF(event) {
        const value = event.target.value;
        f.state = +value;
        c.state = +((5 / 9) * (f.state - 32)).toFixed(1);
      }

      component('temp-converter', [ setFromC, setFromF ]);
    </script>
  </body>
</html>
