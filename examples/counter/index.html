<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Button</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      counter-button > button {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 6px 10px;
      }
      counter-button > button:hover,
      counter-button > button:active {
        cursor: pointer;
        background-color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <counter-button>
      <button @click="increment">
        Clicked <x-signal>0</x-signal> times
      </button>
    </counter-button>
    <script type="module">
      import { component, signal } from "../../src/index.ts";

      const count = signal("counter-button");
      function increment() {
        count.state = count.state + 1;
      }
      component("counter-button", [increment]);
    </script>
  </body>
</html>
