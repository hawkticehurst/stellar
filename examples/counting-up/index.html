<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counting Up</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      counter-button > button {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 6px 10px;
      }
      counter-button > button:hover,
      counter-button > button:active {
        cursor: pointer;
        background-color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <counting-up>
      <p>Count value is <x-signal>0</x-signal></p>
    </counting-up>
    <script type="module">
      import { component, signal } from "../../src/index.ts";

      const count = signal("counting-up");
      
      const interval = setInterval(
				() => count.state = count.state + 1,
				1000
			);
			onDisconnected(() => clearInterval(interval));

      component("counting-up", [onDisconnected]);
    </script>
  </body>
</html>
