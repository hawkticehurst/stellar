<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derived State</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      derived-state > button {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 6px 10px;
      }
      derived-state > button:hover,
      derived-state > button:active {
        cursor: pointer;
        background-color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <derived-state>
      <button @click="increment">
        Clicked <x-signal id="count">0</x-signal> times
      </button>
      <p>Doubled: <x-signal id="double">0</x-signal></p>
    </derived-state>
    <script type="module">
      import { component, signal } from "../../src/index.ts";
      
      const count = signal("derived-state #count");
      const double = signal("derived-state #double");

      double.computed = () => count.state * 2;

      function increment() {
        count.state = count.state + 1;
      }
      
      component("derived-state", [increment]);
    </script>
  </body>
</html>
