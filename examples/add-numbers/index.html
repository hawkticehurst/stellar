<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Numbers</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: grid;
        place-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      add-numbers {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      add-numbers > button {
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: black;
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 8px;
        padding: 6px 10px;
        width: fit-content;
      }
      add-numbers > button:hover,
      add-numbers > button:active {
        cursor: pointer;
        background-color: #e6e6e6;
      }
    </style>
  </head>
  <body>
    <add-numbers>
      <p>
        <x-signal id="numbers" state="[1,2,3,4]">1 + 2 + 3 + 4</x-signal> =
        <x-signal id="sum">10</x-signal>
      </p>
      <button @click="addNumber">Add number</button>
    </add-numbers>
    <script type="module">
      import { component, signal } from "../../src/index.ts";

      const numbers = signal("add-numbers #numbers");
      const sum = signal("add-numbers #sum");

      numbers.render = (state) => state.join(" + ");

      function addNumber() {
        numbers.state = [...numbers.state, numbers.state.length + 1];
        sum.state = numbers.state.reduce((sum, current) => sum + current, 0);
      }
      
      component("add-numbers", [addNumber]);
    </script>
  </body>
</html>
