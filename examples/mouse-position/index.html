<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Position</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      mouse-position {
        background-color: #efefef;
        border: 2px solid #000;
        border-radius: 6px;
        width: 80%;
        height: 80%;
        display: grid;
        place-content: center;
        cursor: crosshair;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <mouse-position @mousemove="setPosition">
      <p>
        The mouse position is <x-signal id="x">0</x-signal> x
        <x-signal id="y">0</x-signal>
      </p>
    </mouse-position>
    <script type="module">
      import { component, signal } from "../../src/index.ts";

      const x = signal("mouse-position #x");
      const y = signal("mouse-position #y");

      const container = document.querySelector("mouse-position");
      const clientRect = container.getBoundingClientRect();

      function setPosition(event) {
        x.state = event.clientX - Number(clientRect.left.toFixed(0));
        y.state = event.clientY - Number(clientRect.top.toFixed(0));
      }
      
      component("mouse-position", [setPosition]);
    </script>
  </body>
</html>
